<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloudfull on iPhone Duo</title>
<meta name="description" content="Cloudfull on iPhone Duo: your camera roll, one video at a time.">
<meta name="theme-color" content="#0e0f12">
<meta property="og:title" content="Cloudfull on iPhone Duo">
<meta property="og:description" content="Your camera roll, one video at a time.">
<meta property="og:image" content="https://cloudfull.app/duo/cloudfull-duo-pitch.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0f12;
    --bg-2: #060708;
    --fg: #f2f2f4;
    --muted: #9a9aa2;
    --muted-2: #6c6c74;
    --card: #15161a;
    --card-2: #1a1c21;
    --border: #2a2d34;
    --accent: #81D3FE;
    --accent-fg: #000000;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
  }
  html { overflow-x: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  img, video { max-width: 100%; }

  a { color: var(--accent); }

  /* ---------- top nav ---------- */
  .nav {
    position: static;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px clamp(16px, 4vw, 48px);
  }
  .nav a.back {
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    opacity: 0.85;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .nav a.back:hover { opacity: 1; }
  .nav .brand {
    color: #fff;
    opacity: 0.7;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  .hero-media {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: 86svh;
    background: #000;
    overflow: hidden;
  }
  .hero-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  @media (max-width: 700px) {
    .hero-media { aspect-ratio: 9 / 16; max-height: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-video { display: none; }
    .hero-media { background: #000 url(/duo/cloudfull-duo-pitch.jpg) center / contain no-repeat; }
  }
  @media (prefers-reduced-motion: reduce) and (max-width: 700px) {
    .hero-media { background-image: url(/duo/cloudfull-duo-pitch-vertical.jpg); }
  }
  .hero-scrim { display: none; }
  .hero-content {
    position: relative;
    z-index: 2;
    padding: clamp(28px, 5vh, 56px) clamp(16px, 5vw, 64px) clamp(32px, 6vh, 72px);
    max-width: 920px;
  }
  .hero h1 {
    font-size: clamp(34px, 6.4vw, 72px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.04;
    margin: 0 0 14px;
    text-shadow: 0 2px 24px rgba(0,0,0,0.35);
  }
  .hero h1 .accent { color: var(--accent); }
  .hero .sub {
    font-size: clamp(16px, 2.2vw, 22px);
    color: #e6e6ea;
    font-weight: 500;
    margin: 0;
    max-width: 44ch;
  }

  /* ---------- generic section ---------- */
  section { position: relative; }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 clamp(16px, 4vw, 48px);
  }
  .eyebrow {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .section-head {
    padding: clamp(64px, 11vh, 120px) 0 clamp(28px, 5vh, 48px);
    text-align: center;
  }
  .section-head h2 {
    font-size: clamp(28px, 4.4vw, 48px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.08;
    margin: 0 auto 14px;
    max-width: 18ch;
  }
  .section-head p {
    color: var(--muted);
    font-size: clamp(15px, 1.7vw, 18px);
    max-width: 52ch;
    margin: 0 auto;
  }

  /* ---------- gallery ---------- */
  .gallery-wrap {
    padding-bottom: clamp(56px, 9vh, 96px);
    max-width: 100vw;
    min-width: 0;
    overflow: hidden;
  }
  .gallery {
    display: flex;
    width: 100%;
    max-width: 100vw;
    box-sizing: border-box;
    gap: 16px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 4px clamp(16px, 4vw, 48px) 20px;
    scrollbar-width: none;
  }
  .gallery::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 82vw;
    max-width: 420px;
    scroll-snap-align: center;
    margin: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card .shot {
    display: block;
    width: 100%;
    height: auto;
    background: var(--card-2);
  }
  .card figcaption {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .card h3 {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.22;
    margin: 0 0 6px;
  }
  .card h3 .accent { color: var(--accent); }
  .card p {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
  }
  .card .chip {
    display: inline-block;
    margin-top: 2px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    font-size: 13px;
    color: #d8d8dc;
  }

  @media (min-width: 820px) {
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px 24px;
      overflow: visible;
      padding: 4px clamp(16px, 4vw, 48px) 0;
    }
    .card { flex: initial; max-width: none; }
  }

  /* ---------- built / privacy ---------- */
  .panel-section {
    padding: clamp(56px, 9vh, 96px) 0;
    border-top: 1px solid var(--border);
  }
  .panel-grid {
    display: grid;
    gap: 14px;
  }
  @media (min-width: 680px) {
    .panel-grid { grid-template-columns: 1fr 1fr; }
  }
  ul.features {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 10px;
  }
  ul.features li {
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    color: #d9d9dd;
  }
  ul.features code {
    background: rgba(255,255,255,0.08);
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 0.92em;
  }
  .built-link {
    margin: 14px 2px 0;
    color: var(--muted);
    font-size: 14px;
  }
  .privacy-copy {
    font-size: clamp(16px, 2vw, 19px);
    color: #d9d9dd;
    max-width: 46ch;
  }
  .privacy-copy strong {
    color: var(--fg);
  }

  /* ---------- footer ---------- */
  footer {
    padding: clamp(40px, 7vh, 72px) 0 56px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  footer .appstore {
    display: inline-block;
    margin-bottom: 18px;
  }
  footer .appstore img {
    display: block;
    height: 54px;
    width: auto;
    margin: 0 auto;
  }
  footer .source { margin: 0 0 8px; }
  footer .copyright { margin: 0; }
</style>
</head>
<body>

<header class="nav">
  <a class="back" href="../">&larr; Cloudfull</a>
  <span class="brand">iPhone Duo</span>
</header>

<section class="hero">
  <div class="hero-media">
    <video id="heroVideo" class="hero-video" autoplay muted loop playsinline preload="metadata" poster="/duo/cloudfull-duo-pitch.jpg">
      <source media="(max-width: 700px)" src="/duo/cloudfull-duo-pitch-vertical.mp4" type="video/mp4">
      <source src="/duo/cloudfull-duo-pitch.mp4" type="video/mp4">
    </video>
    <div class="hero-scrim"></div>
  </div>
  <div class="hero-content">
    <h1>Cloudfull on iPhone <span class="accent">Duo</span></h1>
    <p class="sub">Hope scroll your camera roll.</p>
  </div>
</section>

<section class="gallery-wrap">
  <div class="gallery">
    <figure class="card">
      <img class="shot" loading="lazy" decoding="async"
           src="img/inner-01@700.jpg"
           srcset="img/inner-01@700.jpg 700w, img/inner-01@1400.jpg 1400w"
           sizes="(min-width: 820px) 30vw, 82vw"
           alt="Cloudfull open in a tall layout on iPhone Duo, playing a video at a café table.">
      <figcaption>
        <h3>Relive your <span class="accent">camera roll</span>.</h3>
        <p>In a familiar social media-ish format.</p>
      </figcaption>
    </figure>

    <figure class="card">
      <img class="shot" loading="lazy" decoding="async"
           src="img/inner-02@700.jpg"
           srcset="img/inner-02@700.jpg 700w, img/inner-02@1400.jpg 1400w"
           sizes="(min-width: 820px) 30vw, 82vw"
           alt="The Bin open on Cloudfull, showing four deleted videos that can still be restored.">
      <figcaption>
        <h3><span class="accent">Delete</span> old junk.</h3>
        <p>Free up cloud storage.</p>
      </figcaption>
    </figure>

    <figure class="card">
      <img class="shot" loading="lazy" decoding="async"

           srcset="img/inner-03@700.jpg 700w, img/inner-03@1400.jpg 1400w"
           sizes="(min-width: 820px) 30vw, 82vw"
           alt="Cloudfull folded like a book on iPhone Duo, a video on the left page and the same week's videos on the right.">
      <figcaption>
        <h3>Open it like a <span class="accent">book</span>.</h3>
        <p>Look through similar moments.</p>
      </figcaption>
    </figure>

    <figure class="card">
      <img class="shot" loading="lazy" decoding="async"
           src="img/inner-04@700.jpg"
           srcset="img/inner-04@700.jpg 700w, img/inner-04@1400.jpg 1400w"
           sizes="(min-width: 820px) 30vw, 82vw"
           alt="The Shrink Video sheet open over a 4K video on Cloudfull, showing the file size before and after.">
      <figcaption>
        <h3>Shrink 4K, <span class="accent">keep</span> the memory.</h3>
        <p>4K → 1080p · Save on memory.</p>
      </figcaption>
    </figure>

    <figure class="card">
      <img class="shot" loading="lazy" decoding="async"
           src="img/inner-05@700.jpg"
           srcset="img/inner-05@700.jpg 700w, img/inner-05@1400.jpg 1400w"
           sizes="(min-width: 820px) 30vw, 82vw"
           alt="Cloudfull folded like a laptop on iPhone Duo, playing a birthday video with the controls on the lower half.">
      <figcaption>
        <h3>Set it down. <span class="accent">Business mode</span>.</h3>
        <p>Video on top, controls below.</p>
      </figcaption>
    </figure>

    <figure class="card">
      <img class="shot" loading="lazy" decoding="async"
           src="img/inner-06@700.jpg"
           srcset="img/inner-06@700.jpg 700w, img/inner-06@1400.jpg 1400w"
           sizes="(min-width: 820px) 30vw, 82vw"
           alt="Cloudfull open in a tall layout on iPhone Duo, playing a video of a dog, with Keep highlighted in red.">
      <figcaption>
        <h3>Keep the ones you <span class="accent">love</span>.</h3>
        <p>Kept memories stay preserved.</p>
      </figcaption>
    </figure>

    <figure class="card">
      <img class="shot" loading="lazy" decoding="async"
           src="img/outer-01@700.jpg"
           srcset="img/outer-01@700.jpg 700w, img/outer-01@1400.jpg 1400w"
           sizes="(min-width: 820px) 30vw, 82vw"
           alt="Cloudfull closed on iPhone Duo, playing a video of a woman walking five dogs.">
      <figcaption>
        <h3>Scroll your <span class="accent">camera roll</span>.</h3>
      </figcaption>
    </figure>

    <figure class="card">
      <img class="shot" loading="lazy" decoding="async"
           src="img/outer-02@700.jpg"
           srcset="img/outer-02@700.jpg 700w, img/outer-02@1400.jpg 1400w"
           sizes="(min-width: 820px) 30vw, 82vw"
           alt="The Bin open on Cloudfull's outer screen, showing four deleted videos and the option to empty it.">
      <figcaption>
        <h3>Free up space, <span class="accent">safely</span>.</h3>
        <p>The Bin catches everything first.</p>
      </figcaption>
    </figure>

    <figure class="card">
      <img class="shot" loading="lazy" decoding="async"
           src="img/outer-03@700.jpg"
           srcset="img/outer-03@700.jpg 700w, img/outer-03@1400.jpg 1400w"
           sizes="(min-width: 820px) 30vw, 82vw"
           alt="Cloudfull on iPhone Duo standing folded, a wide candlelit dinner video filling the outer screen.">
      <figcaption>
        <h3>Turn it sideways. <span class="accent">Full screen.</span></h3>
        <p>Wide videos fill the outer screen.</p>
      </figcaption>
    </figure>
  </div>
</section>

<footer>
  <div class="wrap">
    <a class="appstore" href="https://apps.apple.com/app/id6816547769">
      <img src="../app-store-badge.svg" alt="Download on the App Store">
    </a>
    <p class="source"><a href="../privacy/">Privacy Policy</a> &middot; <a href="https://github.com/MarshallARoss/cloudfull">View the source on GitHub</a></p>
    <p class="copyright">&copy; 2026 Marshall Ross</p>
  </div>
</footer>

<script>
  (function () {
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    var mqPhone = window.matchMedia('(max-width: 700px)');
    var v = document.getElementById('heroVideo');
    if (!v) return;

    function applyPoster() {
      v.poster = mqPhone.matches
        ? '/duo/cloudfull-duo-pitch-vertical.jpg'
        : '/duo/cloudfull-duo-pitch.jpg';
    }
    function applyMotion() {
      if (mq.matches) {
        v.pause();
        v.preload = 'none';
      } else {
        v.preload = 'metadata';
        v.play().catch(function () {});
      }
    }
    applyPoster();
    applyMotion();
    if (mqPhone.addEventListener) mqPhone.addEventListener('change', applyPoster);
    if (mq.addEventListener) mq.addEventListener('change', applyMotion);
  })();
</script>

</body>
</html>
